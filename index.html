<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>마음카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<script src="config.js"></script>
<style>
:root{
  --bg:#FAFAFC;
  --surface:#FFFFFF;
  --surface-2:#F3F1FB;
  --ink:#1B2033;
  --ink-soft:#5B6178;
  --ink-faint:#8B90A8;
  --primary:#F0577E;
  --primary-soft:#FFEAF0;
  --accent:#9B87F5;
  --accent-soft:#F3EFFF;
  --mint:#3FB8AC;
  --mint-soft:#E3F7F4;
  --amber:#DB9A34;
  --amber-soft:#FFF4DE;
  --border:#EFE5EC;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;line-height:1.6;}
h1,h2,h3{font-family:'Gowun Dodum','Noto Sans KR',sans-serif;font-weight:400;margin:0;}
.screen{display:none;min-height:100vh;padding:28px 18px 48px;max-width:560px;margin:0 auto;}
.screen.active{display:block;}
.eyebrow{font-size:.78rem;letter-spacing:.08em;color:var(--accent);font-weight:700;margin-bottom:6px;}

/* ---- intro ---- */
.intro-head{text-align:center;padding:18px 0 28px;}
.intro-head h1{font-size:1.7rem;margin-bottom:10px;}
.intro-head p{color:var(--ink-soft);font-size:.95rem;}
.cardlist{display:flex;flex-direction:column;gap:14px;}
.mindcard{
  display:flex;align-items:center;gap:14px;padding:18px 16px;border-radius:18px;
  border:1px solid var(--border);background:var(--surface);cursor:pointer;
  transition:transform .15s,box-shadow .15s;text-align:left;width:100%;
}
.mindcard:active{transform:scale(.98);}
.mindcard .emoji{font-size:1.9rem;flex-shrink:0;width:48px;height:48px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;background:var(--primary-soft);}
.mindcard .txt b{display:block;font-size:1.05rem;color:var(--ink);margin-bottom:2px;}
.mindcard .txt span{font-size:.84rem;color:var(--ink-soft);}
.mindcard:nth-child(1) .emoji{background:var(--primary-soft);}
.mindcard:nth-child(2) .emoji{background:var(--amber-soft);}
.mindcard:nth-child(3) .emoji{background:var(--accent-soft);}
.mindcard:nth-child(4) .emoji{background:var(--mint-soft);}

/* ---- quiz ---- */
.progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.backbtn{background:none;border:none;color:var(--ink-faint);font-size:1.3rem;cursor:pointer;padding:4px 8px;}
.progress-bar{flex:1;height:8px;border-radius:100px;background:var(--surface-2);overflow:hidden;}
.progress-fill{height:100%;background:var(--primary);border-radius:100px;transition:width .3s;}
.progress-num{font-size:.78rem;color:var(--ink-faint);flex-shrink:0;}
.qtitle{font-size:1.25rem;margin-bottom:22px;line-height:1.5;}
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{
  text-align:left;padding:16px 16px;border-radius:14px;border:1.5px solid var(--border);
  background:var(--surface);font-size:.98rem;color:var(--ink);cursor:pointer;
}
.opt:active{background:var(--primary-soft);border-color:var(--primary);}

/* ---- result ---- */
.result-emoji{font-size:3rem;text-align:center;margin-bottom:6px;}
.result-type{text-align:center;font-size:1.5rem;margin-bottom:6px;}
.result-sub{text-align:center;color:var(--ink-soft);font-size:.9rem;margin-bottom:22px;}
.result-box{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:16px;}
.result-box h3{font-size:.82rem;letter-spacing:.04em;color:var(--accent);margin-bottom:8px;}
.result-box p{margin:0;color:var(--ink-soft);font-size:.95rem;}
.talk-box{background:var(--accent-soft);border-radius:18px;padding:20px;margin-bottom:16px;}
.talk-box h3{font-size:.82rem;letter-spacing:.04em;color:var(--accent);margin-bottom:8px;}
.talk-box p{margin:0;color:var(--ink);font-size:1rem;font-weight:500;}
.item-box{
  display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--primary-soft),var(--accent-soft));
  border-radius:18px;padding:18px;margin-bottom:24px;
}
.item-box .emoji{font-size:2rem;}
.item-box b{display:block;font-size:.78rem;color:var(--primary);letter-spacing:.04em;}
.item-box span{font-size:1.05rem;color:var(--ink);font-weight:700;}
.restart-btn{
  display:block;width:100%;padding:15px;border-radius:14px;border:none;background:var(--ink);
  color:#fff;font-size:1rem;font-weight:700;cursor:pointer;
}
</style>
</head>
<body>

<!-- 화면 1: 마음카드 소개 -->
<section class="screen active" id="screen-intro">
  <div class="intro-head">
    <span class="eyebrow">청년마음돌봄 부스</span>
    <h1>오늘, 당신의 마음은<br>어디에 가까운가요?</h1>
    <p>마음에 가장 가까운 카드를 하나 골라주세요.<br>짧은 체크 후 또래상담자와 이야기를 나눠요.</p>
  </div>
  <div class="cardlist" id="cardlist"></div>
</section>

<!-- 화면 2: 검사 진행 -->
<section class="screen" id="screen-quiz">
  <div class="progress-wrap">
    <button class="backbtn" id="backBtn">‹</button>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-num" id="progressNum"></div>
  </div>
  <h2 class="qtitle" id="qtitle"></h2>
  <div class="opts" id="opts"></div>
</section>

<!-- 화면 3: 결과 -->
<section class="screen" id="screen-result">
  <div class="result-emoji" id="resultEmoji"></div>
  <div class="eyebrow" style="text-align:center;" id="resultCardName"></div>
  <h2 class="result-type" id="resultType"></h2>
  <p class="result-sub" id="resultSub"></p>

  <div class="result-box">
    <h3>이런 모습일 수 있어요</h3>
    <p id="resultDesc"></p>
  </div>

  <div class="talk-box">
    <h3>또래상담자와 나눠볼 질문</h3>
    <p id="resultTalk"></p>
  </div>

  <div class="item-box">
    <span class="emoji" id="itemEmoji"></span>
    <div><b>전달 아이템</b><span id="itemName"></span></div>
  </div>

  <button class="restart-btn" id="restartBtn">처음으로 돌아가기</button>
</section>

let current = null; // test object
let qIndex = 0;
let tally = {};

const screens = {
  intro: document.getElementById('screen-intro'),
  quiz: document.getElementById('screen-quiz'),
  result: document.getElementById('screen-result'),
};
function showScreen(name){
  Object.values(screens).forEach(s=>s.classList.remove('active'));
  screens[name].classList.add('active');
  window.scrollTo(0,0);
}

function renderIntro(){
  const list = document.getElementById('cardlist');
  list.innerHTML = '';
  DATA.forEach(test=>{
    const btn = document.createElement('button');
    btn.className = 'mindcard';
    btn.innerHTML = `<span class="emoji">${test.emoji}</span><span class="txt"><b>${test.title}</b><span>${test.desc}</span></span>`;
    btn.addEventListener('click', ()=> startTest(test));
    list.appendChild(btn);
  });
}

function startTest(test){
  current = test;
  qIndex = 0;
  tally = {A:0,B:0,C:0,D:0};
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion(){
  const q = current.questions[qIndex];
  document.getElementById('qtitle').textContent = q.q;
  document.getElementById('progressNum').textContent = (qIndex+1) + ' / ' + current.questions.length;
  document.getElementById('progressFill').style.width = ((qIndex)/current.questions.length*100) + '%';

  const opts = document.getElementById('opts');
  opts.innerHTML = '';
  q.opts.forEach(o=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = o.t;
    btn.addEventListener('click', ()=> selectOption(o.type));
    opts.appendChild(btn);
  });
}

function selectOption(type){
  tally[type] = (tally[type]||0) + 1;
  qIndex++;
  if(qIndex >= current.questions.length){
    showResult();
  } else {
    renderQuestion();
  }
}

document.getElementById('backBtn').addEventListener('click', ()=>{
  if(qIndex === 0){
    showScreen('intro');
  } else {
    qIndex--;
    renderQuestion();
  }
});

const LOG_KEY = 'mindcard_log';
function logCompletion(cardId, cardTitle, typeKey, typeName){
  // 오프라인/연결 실패 대비용 로컬 백업
  try{
    const log = JSON.parse(localStorage.getItem(LOG_KEY) || '[]');
    log.push({ ts: Date.now(), cardId, cardTitle, typeKey, typeName });
    localStorage.setItem(LOG_KEY, JSON.stringify(log));
  }catch(e){ /* storage unavailable, skip */ }

  // Supabase에 기록 전송 (설정돼 있을 때만)
  if(typeof SUPABASE_URL !== 'undefined' && !SUPABASE_URL.includes('YOUR_PROJECT')){
    fetch(SUPABASE_URL + '/rest/v1/mindcard_log', {
      method: 'POST',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        Prefer: 'return=minimal',
      },
      body: JSON.stringify({ card_id: cardId, card_title: cardTitle, type_key: typeKey, type_name: typeName }),
    }).catch(()=>{ /* 네트워크 실패해도 로컬 백업은 남아있음 */ });
  }
}

function showResult(){
  let best = 'A', max = -1;
  ['A','B','C','D'].forEach(k=>{ if(tally[k] > max){ max = tally[k]; best = k; } });
  const r = current.results[best];
  logCompletion(current.id, current.title, best, r.name);

  document.getElementById('resultEmoji').textContent = r.emoji;
  document.getElementById('resultCardName').textContent = current.title;
  document.getElementById('resultType').textContent = r.name;
  document.getElementById('resultSub').textContent = r.sub;
  document.getElementById('resultDesc').textContent = r.desc;
  document.getElementById('resultTalk').textContent = r.talk;
  document.getElementById('itemEmoji').textContent = current.item.emoji;
  document.getElementById('itemName').textContent = current.item.name;

  document.getElementById('progressFill').style.width = '100%';
  showScreen('result');
}

document.getElementById('restartBtn').addEventListener('click', ()=>{
  current = null;
  showScreen('intro');
});

renderIntro();
</script>
