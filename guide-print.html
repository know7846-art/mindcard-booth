<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>마음카드 유형별 가이드 (인쇄용)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#FAF8F6;
  --surface:#FFFFFF;
  --surface-2:#F4EFEA;
  --ink:#241F2E;
  --ink-soft:#6B6476;
  --ink-faint:#9994A3;
  --line:#E7DED8;
  --warn:#B4452F;
  --warn-soft:#FBEAE6;
  --love:#C9577A; --love-soft:#FBE7ED;
  --stress:#C98A2E; --stress-soft:#FBEBD4;
  --lonely:#5B6FB0; --lonely-soft:#E7EAFA;
  --future:#4E9488; --future-soft:#DFF1EC;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;line-height:1.55;}
h1,h2,h3{font-family:'Gowun Dodum','Noto Sans KR',sans-serif;font-weight:400;margin:0;}

/* ---- on-screen toolbar ---- */
.toolbar{
  position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
  gap:12px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line);
  padding:14px 20px;
}
.toolbar .tb-left{font-size:.86rem;color:var(--ink-soft);}
.toolbar .tb-left b{color:var(--ink);}
.toolbar a{font-size:.82rem;color:var(--ink-faint);text-decoration:none;margin-right:14px;}
.toolbar button{
  border:none;background:var(--ink);color:#fff;font-weight:700;font-size:.88rem;
  padding:10px 18px;border-radius:10px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;
}

/* ---- page ---- */
.page{
  width:210mm;min-height:297mm;margin:22px auto;padding:13mm 13mm;background:var(--surface);
  box-shadow:0 2px 14px rgba(36,31,46,.08);
}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:3mm;padding-bottom:3mm;border-bottom:2px solid var(--line);}
.page-head .ph-emoji{font-size:1.7rem;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.page-head h2{font-size:1.2rem;margin-bottom:2px;}
.page-head .ph-tag{font-size:.8rem;color:var(--ink-faint);}
.page[data-c="love"] .ph-emoji{background:var(--love-soft);}
.page[data-c="stress"] .ph-emoji{background:var(--stress-soft);}
.page[data-c="lonely"] .ph-emoji{background:var(--lonely-soft);}
.page[data-c="future"] .ph-emoji{background:var(--future-soft);}
.page-head .ph-item{margin-left:auto;text-align:right;font-size:.76rem;color:var(--ink-faint);}
.page-head .ph-item b{display:block;font-size:.86rem;color:var(--ink-soft);}

.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:3.5mm;}
.type-block{border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.tb-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px;padding:6px 10px;}
.page[data-c="love"] .tb-head{background:var(--love-soft);}
.page[data-c="stress"] .tb-head{background:var(--stress-soft);}
.page[data-c="lonely"] .tb-head{background:var(--lonely-soft);}
.page[data-c="future"] .tb-head{background:var(--future-soft);}
.tb-head .tb-letter{
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.78rem;
  background:var(--ink);color:#fff;border-radius:50%;width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.tb-head .tb-name{font-weight:700;font-size:.84rem;}
.tb-head .tb-sub{font-size:.68rem;color:var(--ink-soft);}
.tb-body{padding:7px 10px 9px;}
.tb-row{margin-bottom:5px;}
.tb-row:last-child{margin-bottom:0;}
.tb-row .tb-label{font-size:.6rem;letter-spacing:.04em;text-transform:uppercase;font-weight:700;color:var(--ink-faint);margin-bottom:1px;}
.tb-row p,.tb-row .tb-line{margin:0;font-size:.72rem;color:var(--ink-soft);line-height:1.42;}
.tb-scripts{display:flex;flex-direction:column;gap:3px;}
.tb-scripts .tb-line{background:var(--surface-2);border-radius:6px;padding:4px 7px;font-size:.72rem;color:var(--ink);font-weight:500;line-height:1.4;}
.tb-caution{background:var(--warn-soft);border-radius:6px;padding:4px 7px;font-size:.68rem;color:var(--warn);line-height:1.4;}
.tb-caution b{font-weight:700;}

.page-foot{margin-top:3mm;padding-top:2mm;border-top:1px solid var(--line);font-size:.66rem;color:var(--ink-faint);display:flex;justify-content:space-between;}

@media print{
  body{background:#fff;}
  .toolbar{display:none;}
  .page{box-shadow:none;margin:0;width:auto;min-height:0;padding:12mm 13mm;page-break-after:always;}
  .page:last-child{page-break-after:auto;}
  @page{size:A4;margin:0;}
}
@media (max-width:720px){
  .page{width:100%;padding:16px;}
}
</style>
</head>
